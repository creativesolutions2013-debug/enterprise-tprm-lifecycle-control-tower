name: TPRM Control Tower Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Validate TPRM methodology
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile tiering.py
          python -m py_compile controls.py
          python -m py_compile lifecycle.py
          python -m py_compile reporting.py

      - name: Validate synthetic JSON data
        run: |
          python -m json.tool data/vendor_scenarios.json > /dev/null
          python -m json.tool data/vendor_findings.json > /dev/null

      - name: Generate TPRM reports
        run: python app.py

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Confirm generated reports are current
        run: git diff --exit-code outputs/